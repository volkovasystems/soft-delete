name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Docker tests with TAP output
        run: |
          make docker-test || exit 1

      - name: Run Docker linting
        run: |
          make docker-lint || true

      - name: Upload test reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            reports/
            !reports/.gitkeep
          retention-days: 30

      - name: Publish TAP Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            reports/**/*.tap
            reports/**/*.xml
          check_name: "Test Results (TAP)"
          comment_mode: create new
          fail_on: "test failures"

      - name: Cleanup test environment
        if: always()
        run: |
          make docker-clean || true
          make clean-temp || true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bash and dependencies
        run: sudo apt-get install -y bats shellcheck

      - name: Extract version
        id: version
        run: |
          VERSION=$(make version | tr -d '\n') || exit 1
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to extract version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: make package

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files: ./dist/soft-delete-${{ steps.version.outputs.VERSION }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
