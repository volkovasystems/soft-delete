name: Release

on:
  push:
    tags:
      - 'v*'

# Restrict permissions for security
permissions:
  contents: write  # Required for creating releases
  actions: read    # Required for downloading artifacts
  checks: write    # Required for publishing test results

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Docker tests with TAP output
        run: |
          echo "Starting Docker tests..."
          if ! make docker-test; then
            echo "Docker tests failed. Checking for any generated reports..."
            ls -la reports/ || echo "No reports directory found"
            exit 1
          fi
          echo "Docker tests completed successfully"

      - name: Run Docker linting
        run: |
          echo "Starting Docker linting..."
          make docker-lint || echo "Linting completed with warnings (non-fatal)"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            reports/
            !reports/.gitkeep
          retention-days: 30

      - name: Publish TAP Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            reports/**/*.tap
            reports/**/*.xml
          check_name: "Test Results (TAP)"
          comment_mode: create new
          fail_on: "test failures"

      - name: Cleanup test environment
        if: always()
        run: |
          make docker-clean || true
          make clean-temp || true

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bash and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Extract version
        id: version
        run: |
          VERSION=$(make version | tr -d '\n') || exit 1
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to extract version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Build package
        run: make package

      - name: Verify package creation
        run: |
          if [ ! -f "./dist/soft-delete-${{ steps.version.outputs.VERSION }}.tar.gz" ]; then
            echo "Error: Package file not found"
            ls -la dist/
            exit 1
          fi
          echo "Package verified: $(ls -lh ./dist/soft-delete-${{ steps.version.outputs.VERSION }}.tar.gz)"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: ./dist/soft-delete-${{ steps.version.outputs.VERSION }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
